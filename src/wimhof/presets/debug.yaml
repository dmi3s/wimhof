# DEBUG PRESET — NOT FOR BREATHING PRACTICE!
# This file demonstrates all seven core behaviors:
#   inhale / outhale / hold / pass / release / prepare / relax
# It is intended for developers and testers only.
# Do NOT use it for actual breathing exercises.

rounds:
  - section: "Test: Prepare"
    repeat: 1
    sequence:
      - type: "prepare"
        behavior: "prepare"
        duration: 2.0
        label: "Prepare (hold small)"
        display: "countdown"

  - section: "Test: Inhale"
    repeat: 1
    sequence:
      - type: "inhale"
        behavior: "inhale"
        duration: 2.0
        label: "Inhale (grow to max)"
        display: "countdown"

  - section: "Test: Outhale"
    repeat: 1
    sequence:
      - type: "outhale"
        behavior: "outhale"
        duration: 2.0
        label: "Outhale (shrink to min)"
        display: "countdown"

  - section: "Test: Hold"
    repeat: 1
    sequence:
      - type: "hold"
        behavior: "hold"
        duration: 3.0
        label: "Hold (keep radius)"
        display: "countdown"

  - section: "Test: Pass"
    repeat: 1
    sequence:
      - type: "pass"
        behavior: "pass"
        duration: 3.0
        label: "Pass (keep radius)"
        display: "countdown"

  - section: "Test: Release"
    repeat: 1
    sequence:
      - type: "release"
        behavior: "release"
        duration: 3.0
        label: "Release (slow shrink to min)"
        display: "countdown"

  - section: "Test: Relax"
    repeat: 1
    sequence:
      - type: "relax"
        behavior: "relax"
        duration: 3.0
        label: "Relax (resting)"
        display: "countdown"
