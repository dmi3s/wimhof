# DEBUG PRESET — NOT FOR BREATHING PRACTICE!
# This file demonstrates the four core behaviors
# (inhale / outhale / pass / release) and the display modes.
# It is intended for developers and testers only.
# Do NOT use it for actual breathing exercises.

rounds:
  - section: "Test: Inhale"
    repeat: 1
    sequence:
      - type: "inhale"
        behavior: "inhale"
        duration: 2.0
        label: "Inhale (grow to max)"
        display: "countdown"

  - section: "Test: Outhale"
    repeat: 1
    sequence:
      - type: "outhale"
        behavior: "outhale"
        duration: 2.0
        label: "Outhale (shrink to min)"
        display: "countdown"

  - section: "Test: Pass"
    repeat: 1
    sequence:
      - type: "pass"
        behavior: "pass"
        duration: 3.0
        label: "Pass (keep radius)"
        display: "countdown"

  - section: "Test: Release"
    repeat: 1
    sequence:
      - type: "release"
        behavior: "release"
        duration: 3.0
        label: "Release (slow shrink to min)"
        display: "countdown"

  - section: "Test: Cycles display"
    repeat: 3
    sequence:
      - type: "cycle"
        behavior: "pass"
        duration: 1.0
        label: "Cycle counter"
        display: "cycles"
