# DEBUG PRESET — NOT FOR BREATHING PRACTICE!
# This file demonstrates the three core behaviors (inhale / exhale / hold)
# and the display modes. It is intended for developers and testers only.
# Do NOT use it for actual breathing exercises.

rounds:
  - section: "Test: Inhale"
    repeat: 1
    sequence:
      - type: "inhale"
        behavior: "inhale"
        duration: 2.0
        label: "Inhale (grow & hold)"
        display: "countdown"

  - section: "Test: Exhale"
    repeat: 1
    sequence:
      - type: "exhale"
        behavior: "exhale"
        duration: 2.0
        label: "Exhale (shrink)"
        display: "countdown"

  - section: "Test: Hold"
    repeat: 1
    sequence:
      - type: "hold"
        behavior: "hold"
        duration: 3.0
        label: "Hold (keep radius)"
        display: "countdown"

  - section: "Test: Cycles display"
    repeat: 3
    sequence:
      - type: "cycle"
        behavior: "hold"
        duration: 1.0
        label: "Cycle counter"
        display: "cycles"
