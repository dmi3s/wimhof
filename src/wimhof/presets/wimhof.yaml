# Breathing techniques of the Wim Hof Method
# For more information, please visit:
#     https://www.wimhofmethod.com/breathing-techniques

rounds:
  # ==========================================================
  # PREPARATION
  # ==========================================================

  - section: Preparation

    repeat: 1
    sequence:
      - type: prepare
        behavior: prepare
        duration: 3
        label: "PREPARE"

  # ==========================================================
  # BREATHING
  # ==========================================================

  - section: Breathing

    repeat: 2

    sequence:
      - type: inhale
        behavior: inhale
        duration: 2
        label: "INHALE"

      - type: exhale
        behavior: outhale
        duration: 2
        label: "EXHALE"

  - section: Breathing
    inherit: true
    repeat: 28

    sequence:
      - type: inhale
        display: "cycles"

      - type: exhale
        display: "cycles"

  # ==========================================================
  # HOLD
  # ==========================================================

  - section: Hold
    repeat: 1

    sequence:
      - type: hold
        behavior: hold
        duration: 45
        label: "HOLD"

      - type: deep_inhale
        behavior: inhale
        duration: 3
        label: "DEEP INHALE"

      - type: final_hold
        behavior: hold
        duration: 15
        label: "HOLD"

  # ==========================================================
  # RECOVERY
  # ==========================================================

  - section: Recovery
    repeat: 1

    sequence:
      - type: release
        behavior: release
        duration: 3
        label: "RELEASE"

      - type: relax
        behavior: relax
        duration: 3
        label: "RELAX"
