# Soothes the nervous system and promotes sleep.

rounds:
  # ==========================================================
  # PREPARATION
  # ==========================================================

  - section: Preparation
    repeat: 1

    sequence:
      - type: prepare
        behavior: prepare
        duration: 3
        label: "PREPARE"

  # ==========================================================
  # BREATHING
  # ==========================================================

  - section: breathing
    repeat: 2

    sequence:
      - type: inhale
        behavior: inhale
        duration: 4
        label: "INHALE"

      - type: hold
        behavior: hold
        duration: 7
        label: "HOLD"

      - type: outhale
        behavior: outhale
        duration: 8
        label: "EXHALE"

  - section: breathing
    repeat: 6
    inherit: true

    sequence:
      - type: inhale
        display: "cycles"

      - type: hold
        display: "cycles"

      - type: outhale
        display: "cycles"

  # ==========================================================
  # RECOVERY
  # ==========================================================

  - section: Recovery
    repeat: 1

    sequence:
      - type: release
        behavior: release
        duration: 3
        label: "RELEASE"

      - type: relax
        behavior: relax
        duration: 3
        label: "RELAX"
