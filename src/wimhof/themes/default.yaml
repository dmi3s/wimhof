# Тема по умолчанию.
# Цвета могут быть заданы как [R, G, B] (альфа будет взята из кода или 255)
# или [R, G, B, A] (полностью статический цвет, переопределяет код).

background_image: assets/background.jpg
background_music: assets/music.mp3

theme:
  colors:
    # ----- Таймлайн (прогресс-бар) – альфа статическая -----
    timeline_background: [255, 255, 255, 28]
    timeline_fill: [92, 20, 92, 128]
    timeline_glow: [92, 20, 92, 40]
    marker_inactive: [255, 255, 255, 70]
    marker_active: [220, 240, 255, 120]

    # ----- Кольцо (динамическая альфа для внешних слоёв) -----
    ring_base: [80, 200, 255] # альфа задаётся в цикле (20,16,12,8)
    ring_main: [120, 220, 255, 140] # статическая альфа

    # ----- Текст (часть с динамической альфой) -----
    round_section_text: [200, 200, 200, 230]
    center_text: [255, 255, 255] # альфа по умолчанию 255 (можно переопределить)
    hints_text: [44, 52, 117, 200]
    shadow_main_text: [255, 255, 255] # альфа динамическая (завершение)
    shadow_suppl_text: [255, 255, 255] # альфа динамическая

    # ----- Оверлей затемнения – динамическая альфа (fade) -----
    overlay_black: [0, 0, 0] # альфа вычисляется в коде (постоянное затемнение)
